name: API Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      PORT: 3000
      API_BASE_URL: http://localhost:3000

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start API in background
        run: |
          npm start &
          echo $! > .api.pid

      - name: Wait until API is running
        run: |
          echo "Waiting for API health check at http://localhost:3000/healthcheck..."
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthcheck | grep -q '"status":"ok"'; then
              echo "API is healthy and ready for tests."
              exit 0
            fi
            echo "Attempt ${attempt}/30: API not ready yet..."
            sleep 2
          done
          echo "API failed to become healthy in time."
          exit 1

      - name: Run API tests
        run: >-
          npx mocha 'test/pathCoverage/**/*.test.js'
          --timeout 10000
          --reporter mochawesome
          --reporter-options reportDir=mochawesome-report,reportFilename=index,html=true,json=true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: mochawesome-report/
          retention-days: 7
