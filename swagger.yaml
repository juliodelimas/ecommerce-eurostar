openapi: 3.0.3
info:
  title: E-Commerce Eurostar REST API
  description: |
    REST API for an e-commerce platform with JWT authentication and checkout.

    ## Checkout Rules
    - Payment methods: only `cash` or `credit_card` are accepted.
    - Cash payments receive a **10% discount** on the subtotal.
    - Checkout requires a valid JWT token.
  version: 1.0.0
  contact:
    name: E-Commerce Eurostar

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: API health status
  - name: Auth
    description: User registration and authentication
  - name: Checkout
    description: Order checkout (authenticated)

paths:
  /healthcheck:
    get:
      tags:
        - Health
      summary: Healthcheck
      description: Returns the current health status of the API.
      operationId: healthcheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: '2026-06-15T12:00:00.000Z'

  /register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account and returns a JWT token.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: John Doe
              email: john@example.com
              password: mypassword
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email, password, and name are required.
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email already registered.

  /login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticates a user and returns a JWT token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email and password are required.
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid email or password.

  /checkout:
    post:
      tags:
        - Checkout
      summary: Checkout
      description: |
        Places an order for the given items. Requires authentication.

        - `cash` payment applies a 10% discount on the subtotal.
        - `credit_card` payment has no discount.
      operationId: checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              cash:
                summary: Cash payment (10% discount)
                value:
                  items:
                    - productId: 1
                      quantity: 2
                    - productId: 3
                      quantity: 1
                  paymentMethod: cash
              creditCard:
                summary: Credit card payment
                value:
                  items:
                    - productId: 2
                      quantity: 1
                  paymentMethod: credit_card
      responses:
        '200':
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid request or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required. Provide a valid JWT token.
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /login or /register

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-06-15T12:00:00.000Z'
      required:
        - status
        - timestamp

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: mypassword
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: password123
      required:
        - email
        - password

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: alice@example.com
        name:
          type: string
          example: Alice Johnson
      required:
        - id
        - email
        - name

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT token valid for 24 hours
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - user
        - token

    CheckoutItem:
      type: object
      properties:
        productId:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
      required:
        - productId
        - quantity

    CheckoutRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItem'
        paymentMethod:
          type: string
          enum:
            - cash
            - credit_card
          example: cash
      required:
        - items
        - paymentMethod

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Headphones
        price:
          type: number
          format: float
          example: 99.99
        quantity:
          type: integer
          example: 2
        itemTotal:
          type: number
          format: float
          example: 199.98
      required:
        - productId
        - name
        - price
        - quantity
        - itemTotal

    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: integer
          example: 1718452800000
        userId:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        paymentMethod:
          type: string
          enum:
            - cash
            - credit_card
          example: cash
        subtotal:
          type: number
          format: float
          example: 249.97
        discount:
          type: number
          format: float
          example: 25.0
        discountRate:
          type: string
          example: 10%
        total:
          type: number
          format: float
          example: 224.97
      required:
        - orderId
        - userId
        - items
        - paymentMethod
        - subtotal
        - discount
        - discountRate
        - total

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid email or password.
      required:
        - error
